/* ---------- lógica de líneas ---------- */
function enviada(l){return l.enviado!==false}
function completa(l){return enviada(l)&&(l.cocina?l.listo:true)&&l.entregado}
function lineasDe(mesaId){return Object.values(S.lineas).filter(l=>l.mesaId===mesaId).sort((a,b)=>a.creadoEn-b.creadoEn)}
function totales(items){const t={alimentos:0,cocteleria:0,refrescos:0,total:0};items.forEach(i=>{const g=t[i.grupo]!=null?i.grupo:"alimentos";t[g]+=Number(i.precio)||0;t.total+=Number(i.precio)||0});return t}
function pendientesCocina(){return Object.values(S.lineas).filter(l=>enviada(l)&&l.cocina&&!l.entregado)}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;let keep=null;
  if(a&&a.id&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")){keep={id:a.id,v:a.value,s:a.selectionStart,e:a.selectionEnd}}
  document.querySelectorAll("#tabs a").forEach(x=>x.setAttribute("aria-current",x.dataset.v===S.view?"page":"false"));
  const kb=document.getElementById("kbadge");const np=pendientesCocina().filter(l=>!l.listo).length;kb.hidden=!np;kb.textContent=np;
  document.getElementById("chip-est").hidden=!(ESTACION&&MODE==="web");
  const app=document.getElementById("app");
  if(S.status==="nodb"){app.innerHTML=MODE==="claude"?`<div class="panel stack"><h2>Abre la app con tu cuenta</h2><p>Esta página guarda las órdenes en tu cuenta de Claude. Inicia sesión en claude.ai en este dispositivo y vuelve a abrir el link.</p></div>`:`<div class="panel stack"><h2>Sin conexión</h2><p>No se pudo conectar con la base de datos. Revisa el internet de este dispositivo y recarga la página.</p></div>`;return}
  if(S.status==="login"){app.innerHTML=`<form class="panel stack login" data-form="login"><h2>Iniciar sesión</h2><p class="muted" style="margin:0">Entra con la cuenta del restaurante. Este dispositivo la recordará.</p>
    <label class="label" for="l-correo">Correo</label><input id="l-correo" type="text" inputmode="email" autocomplete="username" autocapitalize="off">
    <label class="label" for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px">
    ${S.loginError?`<div class="notice bad">${esc(S.loginError)}</div>`:""}
    <button class="btn primary" type="submit">Entrar</button></form>`;return}
  if(S.status==="loading"){app.innerHTML=`<div class="empty">Conectando con la base de datos…</div>`;return}
  let h=S.stale?`<div class="notice" style="margin-bottom:12px">Sin conexión con la base de datos: lo que ves puede no estar al día.</div>`:"";
  if(!S.menu&&S.view!=="menu"&&S.view!=="corte")h+=`<div class="notice" style="margin-bottom:12px">Todavía no hay menú cargado. Ve a <a href="#menu">Menú</a> para agregar platillos.</div>`;
  h+=({ordenes:vOrdenes,cocina:vCocina,corte:vCorte,menu:vMenu}[S.view]||vOrdenes)();
  app.innerHTML=h;
  renderModal();
  if(keep){const el=document.getElementById(keep.id);if(el){if(el.value!==keep.v)el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(_){}}}
}

function vOrdenes(){
  const mesas=Object.values(S.mesas).sort((a,b)=>a.abiertaEn-b.abiertaEn);
  if(S.selMesa&&!S.mesas[S.selMesa])S.selMesa=null;
  const cats=(S.menu&&S.menu.categorias)||[];
  if(!S.cat||!cats.find(c=>c.id===S.cat))S.cat=cats[0]&&cats[0].id;
  const cat=cats.find(c=>c.id===S.cat);
  let left=`<div class="stack">
   <form class="panel stack" data-form="nueva-mesa">
     <div class="row" style="justify-content:space-between"><h2>Mesas abiertas</h2><span class="label">${mesas.length} activas</span></div>
     <div class="row"><input id="nueva-mesa" type="text" placeholder="Nombre de la mesa (Mesa 4, Barra, Para llevar)" style="flex:1 1 220px" autocomplete="off">
     <button class="btn primary" type="submit">Abrir mesa</button></div>
     <div class="mesas">${mesas.map(m=>{const ls=lineasDe(m.id);const pend=ls.filter(l=>!completa(l)).length;
       return `<button type="button" class="mesa-btn" data-act="sel-mesa" data-id="${m.id}" aria-pressed="${S.selMesa===m.id}"><span>${pend?'<span class="dot"></span>':""}${esc(m.nombre)}</span><small class="num">${money(totales(ls.filter(enviada)).total)}${ls.some(l=>!enviada(l))?" · sin enviar":""} · desde ${hora(m.abiertaEn)}</small></button>`}).join("")||'<span class="muted">No hay mesas abiertas. Escribe un nombre y toca “Abrir mesa”.</span>'}</div>
   </form>`;
  if(S.selMesa){
    left+=`<div class="panel stack"><div class="cats" role="toolbar" aria-label="Categorías">${cats.map(c=>`<button type="button" class="cat-btn" data-act="cat" data-id="${c.id}" aria-pressed="${c.id===S.cat}">${esc(c.nombre)}</button>`).join("")}</div>
      ${cat?`<div class="platos">${(cat.platillos||[]).map(p=>`<button type="button" class="plato g-${cat.grupo}" data-act="plato" data-cat="${cat.id}" data-id="${p.id}"><b>${esc(p.nombre)}</b><span class="num">${p.libre?"Precio al momento":p.tamanos?Object.entries(p.tamanos).map(([k,v])=>k[0]+" "+money(v)).join(" · "):money(p.precio)}</span></button>`).join("")||'<div class="muted">Esta categoría no tiene productos. Agrégalos en Menú.</div>'}</div>`:""}
    </div>`;
  }else if(mesas.length){left+=`<div class="panel empty">Toca una mesa para tomar su orden.</div>`}
  left+=`</div>`;
  return `<div class="ord">${left}<aside>${S.selMesa?vCuenta(S.mesas[S.selMesa]):""}</aside></div>`;
}

function vCuenta(m){
  const ls=lineasDe(m.id);const t=totales(ls.filter(enviada));const borr=ls.filter(l=>!enviada(l));
  return `<div class="panel stack cuenta">
   <div class="row" style="justify-content:space-between"><h2>${esc(m.nombre)}</h2><span class="label">Abierta ${hora(m.abiertaEn)}</span></div>
   <div class="lineas">${ls.map(l=>{
     let st, acts="";
     if(!enviada(l)){return `<div class="linea g-${l.grupo}" style="border-style:dashed;background:var(--surface)"><div><div class="nm">${esc(l.nombre)}${l.variante?` <span class="muted">(${esc(l.variante)})</span>`:""}</div>${l.nota?`<div class="nota">» ${esc(l.nota)}</div>`:""}</div><div class="num" style="font-weight:600">${money(l.precio)}</div><div class="acts"><span class="st done">Sin enviar</span><button class="btn sm ghost" data-act="nota" data-id="${l.id}">${l.nota?"Editar nota":"Nota"}</button><button class="btn sm ghost" data-act="quitar-borrador" data-id="${l.id}">Quitar</button></div></div>`}
     if(completa(l))st=`<span class="st done">✓✓ Entregado</span>`;
     else if(l.cocina&&!l.listo)st=`<span class="st wait">En cocina · ${mins(l.creadoEn)} min</span>`;
     else st=`<span class="st ready">${l.cocina?"✓ Listo en cocina":"Por entregar"}</span>`;
     if(!completa(l)){
       acts+=`<button class="btn sm ${l.cocina&&!l.listo?"":"ok"}" data-act="entregar" data-id="${l.id}" ${l.cocina&&!l.listo?"disabled":""}>Entregado</button>`;
       if(!l.listo)acts+=`<button class="btn sm ghost" data-act="nota" data-id="${l.id}">${l.nota?"Editar nota":"Nota"}</button>`;
     }else acts+=`<button class="btn sm ghost" data-act="desentregar" data-id="${l.id}">Deshacer</button>`;
     acts+=`<button class="btn sm ghost" data-act="quitar" data-id="${l.id}" aria-label="Quitar ${esc(l.nombre)}">Quitar</button>`;
     return `<div class="linea g-${l.grupo} ${completa(l)?"done":""}"><div><div class="nm">${esc(l.nombre)}${l.variante?` <span class="muted">(${esc(l.variante)})</span>`:""}</div>${l.nota?`<div class="nota">» ${esc(l.nota)}</div>`:""}</div><div class="num" style="font-weight:600">${money(l.precio)}</div><div class="acts">${st}${acts}</div></div>`}).join("")||'<div class="muted">Sin productos todavía. Toca un platillo para agregarlo.</div>'}</div>
   ${borr.length?`<button class="btn primary" data-act="enviar" style="min-height:56px;font-size:18px">Enviar a cocina (${borr.length}) · ${money(totales(borr).total)}</button>`:""}
   <div class="stack" style="gap:2px;border-top:1px solid var(--line);padding-top:10px">
     ${Object.keys(GRUPOS).map(g=>`<div class="sub"><span>${GRUPOS[g]}</span><span class="num">${money(t[g])}</span></div>`).join("")}
     <div class="tot"><span>Total</span><span class="num">${money(t.total)}</span></div>
   </div>
   <div class="row"><button class="btn" data-act="ver-cuenta" style="flex:1">Ver cuenta</button><button class="btn ${borr.length?"":"primary"}" data-act="cerrar-mesa" style="flex:1" ${ls.some(enviada)?"":"disabled"}>Cobrar y cerrar</button></div>
   ${ls.length?"":`<button class="btn sm ghost" data-act="borrar-mesa">Eliminar mesa vacía</button>`}
  </div>`;
}

function vCocina(){
  let ls=pendientesCocina();
  if(S.kfiltro!=="todo")ls=ls.filter(l=>l.grupo===S.kfiltro);
  const por={};ls.forEach(l=>{(por[l.mesaId]=por[l.mesaId]||[]).push(l)});
  const grupos=Object.keys(por).map(id=>({id,nombre:(S.mesas[id]||{}).nombre||por[id][0].mesaNombre,ls:por[id].sort((a,b)=>a.creadoEn-b.creadoEn)})).sort((a,b)=>a.ls[0].creadoEn-b.ls[0].creadoEn);
  const filtros=[["todo","Todo"],["alimentos","Alimentos"],["cocteleria","Coctelería"],["refrescos","Refrescos"]];
  return `<div class="stack">
   <div class="row" style="justify-content:space-between"><h2>Cocina</h2>
     <div class="kds-filter">${filtros.map(([k,v])=>`<button class="cat-btn" data-act="kfiltro" data-id="${k}" aria-pressed="${S.kfiltro===k}">${v}</button>`).join("")}</div></div>
   <p class="muted" style="margin:0">Toca <b>Listo</b> cuando el platillo sale. Se queda en verde hasta que el mesero marque <b>Entregado</b>; con los dos checks desaparece.</p>
   ${grupos.length?`<div class="kds">${grupos.map(g=>`<section class="ticket"><header><b>${esc(g.nombre)}</b><span class="num">${hora(g.ls[0].creadoEn)}</span></header>
     ${g.ls.map(l=>{const m=mins(l.creadoEn);const tc=l.listo?"ready":m>=20?"t-bad":m>=10?"t-warn":"";
       return `<div class="k-item ${tc}"><div><div class="nm">${esc(l.nombre)}${l.variante?" · "+esc(l.variante):""}</div><div class="meta num">${l.listo?"Listo "+hora(l.listoEn)+" · esperando mesero":m+" min esperando"}</div></div>
       ${l.listo?`<button class="btn kbtn" data-act="deslistar" data-id="${l.id}">Deshacer</button>`:`<button class="btn ok kbtn" data-act="listo" data-id="${l.id}">Listo</button>`}
       ${l.nota?`<div class="nota">» ${esc(l.nota)}</div>`:""}</div>`}).join("")}</section>`).join("")}</div>`
   :`<div class="panel empty">No hay platillos pendientes. Los nuevos aparecen aquí al instante.</div>`}
  </div>`;
}

function vCorte(){
  const v=S.ventas;const t={alimentos:0,cocteleria:0,refrescos:0,total:0};const pago={efectivo:0,tarjeta:0,transferencia:0};
  v.forEach(x=>{Object.keys(GRUPOS).forEach(g=>t[g]+=Number(x[g])||0);t.total+=Number(x.total)||0;pago[x.pago||"efectivo"]+=Number(x.total)||0});
  const gastos=S.gastos.slice().sort((a,b)=>a.creadoEn-b.creadoEn);const tg=gastos.reduce((s,g)=>s+(Number(g.monto)||0),0);
  const fondo=S.caja&&S.caja.fondo!=null?Number(S.caja.fondo):null;
  const esperado=(fondo||0)+pago.efectivo-tg;
  const contado=S.caja&&S.caja.contado!=null?Number(S.caja.contado):null;
  const rank={};v.forEach(x=>(x.items||[]).forEach(i=>{const k=i.nombre+(i.variante?" ("+i.variante+")":"");rank[k]=rank[k]||{n:0,m:0,g:i.grupo};rank[k].n++;rank[k].m+=Number(i.precio)||0}));
  const top=Object.entries(rank).sort((a,b)=>b[1].n-a[1].n||b[1].m-a[1].m).slice(0,10);
  const esHoy=S.fecha===hoy();
  return `<div class="stack">
   <div class="row" style="justify-content:space-between"><h2>Corte de caja</h2>
     <div class="row">${CAN_PRINT?`<button class="btn" data-act="print-corte">Imprimir corte</button>`:""}<input id="fecha" type="date" value="${S.fecha}" aria-label="Fecha del corte">${esHoy?"":`<button class="btn" data-act="hoy">Hoy</button>`}</div></div>
   <div class="tiles">
     ${Object.keys(GRUPOS).map(g=>`<div class="tile g-${g}"><div class="label">${GRUPOS[g]}</div><div class="v num">${money(t[g])}</div></div>`).join("")}
     <div class="tile total"><div class="label">Venta total</div><div class="v num">${money(t.total)}</div><div class="num" style="font-size:13px;opacity:.75">${v.length} cuentas cerradas</div></div>
   </div>
   <div class="corte">
    <div class="stack">
     <section class="panel stack"><h3>Caja</h3>
       <form class="row" data-form="fondo"><label class="label" for="fondo" style="flex:1 1 100%">Cambio con el que se inició</label>
         <input id="fondo" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${fondo!=null?fondo:""}" style="flex:1 1 140px"><button class="btn primary" type="submit">Guardar</button></form>
       <table class="ledger"><tbody>
         <tr><td>Cambio inicial</td><td>${fondo!=null?money(fondo):'<span class="muted">sin capturar</span>'}</td></tr>
         <tr><td>Ventas en efectivo</td><td>${money(pago.efectivo)}</td></tr>
         <tr class="minus"><td>Gastos del día</td><td>− ${money(tg)}</td></tr>
         <tr class="strong"><td>Efectivo que debe haber</td><td>${money(esperado)}</td></tr>
         <tr><td class="muted">Ventas con tarjeta</td><td class="muted">${money(pago.tarjeta)}</td></tr>
         <tr><td class="muted">Ventas por transferencia</td><td class="muted">${money(pago.transferencia)}</td></tr>
       </tbody></table>
       <form class="row" data-form="contado"><label class="label" for="contado" style="flex:1 1 100%">Efectivo contado al cerrar (opcional)</label>
         <input id="contado" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${contado!=null?contado:""}" style="flex:1 1 140px"><button class="btn" type="submit">Guardar</button></form>
       ${contado!=null?(()=>{const d=contado-esperado;return `<div class="notice ${Math.abs(d)<0.5?"":"bad"}" style="${Math.abs(d)<0.5?"background:var(--ok-soft);border-color:var(--ok)":""}">${Math.abs(d)<0.5?"La caja cuadra.":d>0?"Sobran "+money(d)+" en caja.":"Faltan "+money(-d)+" en caja."}</div>`})():""}
     </section>
     <section class="panel stack"><h3>Gastos del día</h3>
       <form class="row" data-form="gasto"><input id="g-concepto" type="text" placeholder="Concepto (hielo, gas, tortillas)" style="flex:2 1 180px" autocomplete="off"><input id="g-monto" type="number" inputmode="decimal" min="0" step="any" placeholder="Monto" style="flex:1 1 100px"><button class="btn primary" type="submit">Agregar</button></form>
       ${gastos.length?`<table class="ledger"><tbody>${gastos.map(g=>`<tr><td>${esc(g.concepto)} <span class="muted num" style="font-size:13px">${hora(g.creadoEn)}</span> <button class="btn sm ghost" data-act="borrar-gasto" data-id="${g.id}" aria-label="Borrar gasto">Borrar</button></td><td>${money(g.monto)}</td></tr>`).join("")}<tr class="strong"><td>Total gastos</td><td>${money(tg)}</td></tr></tbody></table>`:'<div class="muted">Sin gastos registrados este día.</div>'}
     </section>
    </div>
    <div class="stack">
     <section class="panel stack"><h3>Lo más vendido</h3>
       ${top.length?`<div class="rank">${top.map(([k,r],i)=>`<span class="n">${i+1}</span><span>${esc(k)}</span><span class="num muted">${r.n}×</span><span class="num">${money(r.m)}</span>`).join("")}</div>`:'<div class="muted">Aparecerá cuando se cierren cuentas.</div>'}
     </section>
     <section class="panel stack"><h3>Cuentas cerradas</h3>
       ${v.length?v.slice().sort((a,b)=>b.cerradaEn-a.cerradaEn).map(x=>`<details class="cta"><summary><span>${esc(x.mesaNombre)} <span class="muted num" style="font-weight:400">${hora(x.cerradaEn)} · ${PAGOS[x.pago]||"Efectivo"}</span></span><span class="num">${money(x.total)}</span></summary>
         <ul>${(x.items||[]).map(i=>`<li>${esc(i.nombre)}${i.variante?" ("+esc(i.variante)+")":""} — ${money(i.precio)}</li>`).join("")}</ul>${CAN_PRINT?`<button class="btn sm" data-act="reimprimir" data-id="${x.id}" style="margin-top:6px">Reimprimir ticket</button>`:""}</details>`).join(""):'<div class="muted">No hay cuentas cerradas en esta fecha.</div>'}
     </section>
    </div>
   </div>
  </div>`;
}

function vMenu(){
  if(!S.menuDraft)S.menuDraft=JSON.parse(JSON.stringify(S.menu||{categorias:[]}));
  const cats=S.menuDraft.categorias;
  return `<div class="stack">
   <div class="row" style="justify-content:space-between"><h2>Menú y precios</h2><div class="row"><button class="btn" data-act="menu-descartar">Descartar cambios</button><button class="btn primary" data-act="menu-guardar">Guardar menú</button></div></div>
   <p class="muted" style="margin:0">Cada categoría cuenta en el corte como Alimentos, Coctelería o Refrescos. Si “Pasa por cocina” está apagado, solo lleva el check del mesero. Tamaños se escriben así: <b>Chico 70, Mediano 100, Grande 165</b>.</p>
   ${cats.map((c,ci)=>`<section class="panel mcat g-${c.grupo}">
     <div class="row"><input id="c-n-${ci}" type="text" value="${esc(c.nombre)}" data-m="cat-nombre" data-ci="${ci}" style="flex:1 1 160px;font-weight:700" aria-label="Nombre de la categoría">
       <select id="c-g-${ci}" data-m="cat-grupo" data-ci="${ci}" aria-label="Cuenta como">${Object.entries(GRUPOS).map(([k,v])=>`<option value="${k}" ${c.grupo===k?"selected":""}>${v}</option>`).join("")}</select>
       <label class="row" style="gap:4px"><input id="c-k-${ci}" type="checkbox" data-m="cat-cocina" data-ci="${ci}" ${c.cocina?"checked":""}> Pasa por cocina</label>
       <button class="btn sm ghost" data-act="cat-borrar" data-ci="${ci}">Borrar categoría</button></div>
     ${(c.platillos||[]).map((p,pi)=>`<div class="mrow">
       <input id="p-n-${ci}-${pi}" type="text" value="${esc(p.nombre)}" data-m="p-nombre" data-ci="${ci}" data-pi="${pi}" aria-label="Nombre">
       <input id="p-p-${ci}-${pi}" type="text" inputmode="decimal" value="${p.libre?"":p.tamanos?Object.entries(p.tamanos).map(([k,v])=>k+" "+v).join(", "):(p.precio??"")}" placeholder="${p.libre?"Al momento":"Precio"}" ${p.libre?"disabled":""} data-m="p-precio" data-ci="${ci}" data-pi="${pi}" aria-label="Precio">
       <label><input id="p-l-${ci}-${pi}" type="checkbox" data-m="p-libre" data-ci="${ci}" data-pi="${pi}" ${p.libre?"checked":""}> Precio al momento</label>
       <button class="btn sm ghost" data-act="p-borrar" data-ci="${ci}" data-pi="${pi}">Quitar</button></div>`).join("")}
     <div><button class="btn sm" data-act="p-nuevo" data-ci="${ci}">+ Agregar producto</button></div>
   </section>`).join("")}
   ${cats.length?"":`<div class="panel stack"><p style="margin:0">El menú está vacío. Puedes cargar la carta de Mariscos Langostinos con sus precios y después ajustarla.</p><div><button class="btn primary" data-act="menu-inicial">Cargar carta del restaurante</button></div></div>`}
   <div><button class="btn" data-act="cat-nueva">+ Nueva categoría</button></div>
   ${MODE==="web"?`<section class="panel stack"><h3>Este dispositivo</h3>
     <label class="row" style="gap:8px;font-weight:600"><input id="estacion" type="checkbox" ${ESTACION?"checked":""}> Este equipo es la estación de impresión (tiene la impresora conectada)</label>
     <p class="muted" style="margin:0">Actívalo solo en la laptop de caja. Los tickets que se manden desde cualquier teléfono o tablet salen ahí, mientras la app esté abierta.${ESTACION?"":(S.estacion&&Date.now()-S.estacion.visto<180000?" La estación de impresión está conectada.":" Ahora mismo no hay una estación de impresión conectada.")}</p>
     <div><button class="btn sm" data-act="prueba-impresion">Imprimir ticket de prueba</button></div>
     <div style="border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost" data-act="logout">Cerrar sesión en este dispositivo</button></div></section>`:""}
  </div>`;
}

/* ---------- modales ---------- */
function openModal(m){S.modal=m;renderModal()}
function closeModal(){S.modal=null;renderModal()}
function renderModal(){
  const root=document.getElementById("modal-root");const m=S.modal;
  if(!m){root.innerHTML="";return}
  if(root.dataset.k===m.k&&root.innerHTML)return; root.dataset.k=m.k;
  let body="";
  if(m.type==="tamano")body=`<h2>${esc(m.p.nombre)}</h2><div class="stack">${Object.entries(m.p.tamanos).map(([k,v])=>`<button class="btn" style="display:flex;justify-content:space-between;font-size:18px" data-act="m-tamano" data-id="${esc(k)}"><span>${esc(k)}</span><span class="num">${money(v)}</span></button>`).join("")}</div><button class="btn ghost" data-act="m-cerrar">Cancelar</button>`;
  if(m.type==="precio")body=`<h2>${esc(m.p.nombre)}</h2><div class="label">Precio según el peso</div><div class="display num" id="m-disp">$0</div>

async function cobrar(mesaId,pago){
  const mesa=S.mesas[mesaId];const todas=lineasDe(mesaId);const ls=todas.filter(enviada);if(!mesa)return;
  const t=totales(ls);const ahora=Date.now();
  const venta={mesaNombre:mesa.nombre,abiertaEn:mesa.abiertaEn,cerradaEn:ahora,fecha:hoy(),pago,
    items:ls.map(l=>({nombre:l.nombre,variante:l.variante,precio:l.precio,grupo:l.grupo,nota:l.nota||""})),...t};
  try{await S.db.collection("ventas").doc(mesaId).set(venta)}catch(e){fail(e);return}

function subscribeAll(db){
  S.db=db;
  const timer=setTimeout(()=>{S.stale=true;if(S.status==="loading")S.status="ok";render()},10000);
  let got=0;const ready=()=>{if(++got>=3){clearTimeout(timer);S.status="ok";S.stale=false;render()}};
  let r1=false,r2=false,r3=false;
  db.doc("menu/carta").onSnapshot(s=>{S.menu=normMenu(s.exists?s.data():null);if(!r1&&!s.metadata.fromCache){r1=true;ready()}else render()},e=>console.error(e));
  db.collection("mesas").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=Object.assign({id:d.id},d.data()));S.mesas=o;if(!r2&&!s.metadata.fromCache){r2=true;ready()}else render()},e=>console.error(e));
  db.collection("lineas").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=Object.assign({id:d.id},d.data()));S.lineas=o;if(!r3&&!s.metadata.fromCache){r3=true;ready()}else render()},e=>console.error(e));
  if(MODE==="web"){db.doc("estacion/actual").onSnapshot(s=>{S.estacion=s.exists?s.data():null},e=>{});if(ESTACION)iniciarEstacion()}
  subCorte();
}
function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement("script");t.src=src;t.onload=res;t.onerror=rej;document.head.appendChild(t)})}
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v))}
function rtdbAdapter(rtdb){
  const snapDoc=s=>({id:s.key,exists:s.exists(),data:()=>s.exists()?s.val():undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  const docRef=p=>{const r=rtdb.ref(p);return{path:p,id:r.key,
    set:d=>r.set(clean(d)),update:d=>r.update(clean(d)),delete:()=>r.remove(),get:()=>r.get().then(snapDoc),
    onSnapshot(next,err){const cb=s=>next(snapDoc(s));r.on("value",cb,err);return()=>r.off("value",cb)}}};
  const coll=(c,q)=>({path:c,doc:id=>docRef(c+"/"+id),
    where:(f,op,v)=>coll(c,rtdb.ref(c).orderByChild(f).equalTo(v)),
    onSnapshot(next,err){const ref=q||rtdb.ref(c);const cb=s=>{const docs=[];s.forEach(ch=>{docs.push(snapDoc(ch))});next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}})};ref.on("value",cb,err);return()=>ref.off("value",cb)}});
  return{collection:c=>coll(c),doc:docRef};
}
async function start(){
  route();
  if(MODE==="claude"){
    let db=null;try{db=await window.claude.use("db")}catch(e){}
    if(!db){S.status="nodb";render();return}
    subscribeAll(db);return;
  }
  try{
    const B="https://www.gstatic.com/firebasejs/10.12.2/";
    await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-auth-compat.js");await loadScript(B+"firebase-database-compat.js");
    firebase.initializeApp(FB_CONFIG);
  }catch(e){console.error(e);S.status="nodb";render();return}
  S.auth=firebase.auth();
  S.auth.onAuthStateChanged(u=>{
    if(!u){S.status="login";render();return}
    if(!S.db){S.status="loading";render();subscribeAll(rtdbAdapter(firebase.database()))}
  });
}

/* ---------- tickets (impresora térmica 80 mm) ---------- */
function agrupar(items){const ag={};(items||[]).forEach(i=>{const k=i.nombre+"|"+(i.variante||"")+"|"+i.precio;ag[k]=ag[k]||{i,n:0};ag[k].n++});return Object.values(ag)}
function fechaHora(t){const d=new Date(t);return d.toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}
function lineasTicket(items){return agrupar(items).map(a=>`<div class="ln"><span>${a.n} ${esc(a.i.nombre)}${a.i.variante?" "+esc(a.i.variante):""}</span><span>${money(a.i.precio*a.n)}</span></div>`).join("")}
function encabezado(){return `<div class="c big">${NEGOCIO}</div><div class="c">Marisquería</div><div class="hr"></div>`}
function ticketVenta(v,re){
  return encabezado()+(re?`<div class="c b">** REIMPRESIÓN **</div>`:"")+
  `<div>Mesa: ${esc(v.mesaNombre)}</div><div>Fecha: ${fechaHora(v.cerradaEn)}</div><div>Folio: ${esc(String(v.id||"").slice(-6).toUpperCase())}</div><div class="hr"></div>`+
  lineasTicket(v.items)+`<div class="hr"></div><div class="ln big"><span>TOTAL</span><span>${money(v.total)}</span></div><div>Pago: ${PAGOS[v.pago]||"Efectivo"}</div><div class="hr"></div><div class="c">¡Gracias por su visita!</div>`;
}
function ticketCuenta(mesaId){
  const mesa=S.mesas[mesaId]||{};const ls=lineasDe(mesaId).filter(enviada);const t=totales(ls);
  return encabezado()+`<div class="c b">CUENTA</div><div>Mesa: ${esc(mesa.nombre)}</div><div>Fecha: ${fechaHora(Date.now())}</div><div class="hr"></div>`+
  lineasTicket(ls)+`<div class="hr"></div><div class="ln big"><span>TOTAL</span><span>${money(t.total)}</span></div><div class="hr"></div><div class="c">Gracias por su preferencia</div>`;
}
function ticketCorte(){
  const v=S.ventas;const t={alimentos:0,cocteleria:0,refrescos:0,total:0};const pago={efectivo:0,tarjeta:0,transferencia:0};
  v.forEach(x=>{Object.keys(GRUPOS).forEach(g=>t[g]+=Number(x[g])||0);t.total+=Number(x.total)||0;pago[x.pago||"efectivo"]+=Number(x.total)||0});
  const tg=S.gastos.reduce((s,g)=>s+(Number(g.monto)||0),0);const fondo=Number(S.caja&&S.caja.fondo)||0;
  const ln=(a,b)=>`<div class="ln"><span>${a}</span><span>${b}</span></div>`;
  return encabezado()+`<div class="c b">CORTE DE CAJA</div><div class="c">${esc(S.fecha)}</div><div class="hr"></div>`+
   Object.keys(GRUPOS).map(g=>ln(GRUPOS[g],money(t[g]))).join("")+`<div class="ln b"><span>VENTA TOTAL</span><span>${money(t.total)}</span></div><div>${v.length} cuentas</div><div class="hr"></div>`+
   ln("Cambio inicial",money(fondo))+ln("Ventas efectivo",money(pago.efectivo))+ln("Gastos","-"+money(tg))+`<div class="ln b"><span>EFECTIVO EN CAJA</span><span>${money(fondo+pago.efectivo-tg)}</span></div>`+
   ln("Tarjeta",money(pago.tarjeta))+ln("Transferencia",money(pago.transferencia))+
   (S.gastos.length?`<div class="hr"></div><div class="b">Gastos</div>`+S.gastos.map(g=>ln(esc(g.concepto),money(g.monto))).join(""):"")+
   `<div class="hr"></div><div class="c">Impreso ${fechaHora(Date.now())}</div>`;
}
function imprimirLocal(html){const a=document.getElementById("print-area");a.innerHTML=html;window.print()}
async function imprimir(html){
  if(ESTACION){setTimeout(()=>imprimirLocal(html),50);return}
  const id=Date.now().toString(36)+uid();
  try{await S.db.collection("impresiones").doc(id).set({html,creadoEn:Date.now()});
    const v=S.estacion&&S.estacion.visto;toast(v&&Date.now()-v<180000?"Enviado a la impresora de caja":"Enviado, pero la caja de impresión no está conectada")}catch(e){fail(e)}
}
let colaOcupada=false;const vistos=new Set();
function iniciarEstacion(){
  if(!S.db||MODE!=="web")return;
  const beat=()=>S.db.doc("estacion/actual").set({visto:Date.now()}).catch(()=>{});
  beat();S.beat=setInterval(beat,60000);
  S.unsubCola=S.db.collection("impresiones").onSnapshot(async s=>{
    const jobs=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(j=>!vistos.has(j.id)).sort((a,b)=>a.creadoEn-b.creadoEn);
    for(const j of jobs){vistos.add(j.id);try{await S.db.collection("impresiones").doc(j.id).delete()}catch(e){}
      if(Date.now()-j.creadoEn<15*60000){while(colaOcupada)await new Promise(r=>setTimeout(r,300));colaOcupada=true;imprimirLocal(j.html);await new Promise(r=>setTimeout(r,800));colaOcupada=false}}
  },e=>console.error(e));
}
function detenerEstacion(){clearInterval(S.beat);S.unsubCola&&S.unsubCola();S.unsubCola=null}
start();
})();
</script>
